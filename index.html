<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ビジネス英語</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d1a;--card:#0f172a;--border:rgba(255,255,255,.07);
  --blue:#3b82f6;--green:#10b981;--yellow:#fbbf24;--red:#ef4444;
  --text:#f1f5f9;--muted:#475569;--dim:#1e293b;
  --nav:64px;--safe:env(safe-area-inset-bottom,0px);
  --max:440px;--card-font:21px;--jp-font:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;overscroll-behavior:none}
body{
  background:var(--bg);font-family:'Noto Sans JP','Hiragino Sans',sans-serif;
  color:var(--text);display:flex;flex-direction:column;align-items:center;
  padding:12px 14px calc(var(--nav) + var(--safe) + 12px);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
button{cursor:pointer;border:none;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:all .15s}
button:active:not(:disabled){transform:scale(0.96)}
button:disabled{opacity:.4;cursor:not-allowed}
#app{width:100%;max-width:var(--max)}

/* bottom nav */
#bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(8,13,26,.97);border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:stretch;padding-bottom:var(--safe);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.nb{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px;gap:3px;font-size:11px;font-weight:700;color:var(--muted);
  background:none;min-height:var(--nav);
}
.nb.on{color:var(--blue)}
.nb .ic{font-size:20px;line-height:1}

/* flip */
.fw{perspective:1200px;width:100%;cursor:pointer;touch-action:manipulation}
.fi{position:relative;width:100%;min-height:280px;transition:transform .45s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fi.f{transform:rotateY(180deg)}
.ff,.fb{backface-visibility:hidden;-webkit-backface-visibility:hidden;width:100%;border-radius:20px;min-height:280px}
.fb{position:absolute;top:0;left:0;transform:rotateY(180deg)}

/* card image */
.card-img{width:100%;height:110px;object-fit:cover;border-radius:12px;margin-bottom:10px;opacity:.7}
.card-svg{width:100%;height:100px;margin-bottom:10px;opacity:.18}

/* tags */
.tag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.l初級{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.l中級{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.l上級{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.sc{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2)}
.sr{background:rgba(167,139,250,.1);color:#a78bfa;border:1px solid rgba(167,139,250,.2)}

/* mode toggle — card直下 */
#mode-toggle{
  width:100%;padding:13px;border-radius:14px;font-size:14px;font-weight:700;
  margin-top:10px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:8px;
}
#mode-toggle.silent{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.25)}
#mode-toggle.voice{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.3)}

/* rate buttons */
.rr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rno{padding:16px;border-radius:14px;font-size:15px;font-weight:700;background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.ryes{padding:16px;border-radius:14px;font-size:15px;font-weight:700;background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(52,211,153,.3)}

/* speak btn */
.spk{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#94a3b8;
}
.spk.on{background:rgba(16,185,129,.2);border-color:rgba(52,211,153,.5);color:#34d399}

/* recording */
.recbox{width:100%;border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;flex-direction:column;align-items:center;gap:7px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.reddot{width:10px;height:10px;border-radius:50%;background:#ef4444;flex-shrink:0}
.hintbox{width:100%;border-radius:30px;padding:10px 18px;margin-bottom:8px;display:flex;align-items:center;gap:8px;justify-content:center;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2)}
@keyframes rp{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
.reddot.pulse{animation:rp 1s ease infinite}

/* fold6 closed (360px) optimizations */
@media(max-width:390px){
  :root{--card-font:19px;--jp-font:14px}
  body{padding-left:10px;padding-right:10px}
  .rno,.ryes{padding:14px;font-size:14px}
  #mode-toggle{padding:12px;font-size:13px}
}
/* tablet / fold6 open (≥600px) */
@media(min-width:600px){
  :root{--max:560px;--card-font:23px;--jp-font:16px}
  .rno,.ryes{padding:18px;font-size:16px}
  .card-img{height:140px}
}
/* PC (≥1024px) */
@media(min-width:1024px){
  :root{--max:640px}
  body{padding-top:24px}
}
/* misc */
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .25s ease forwards}
.card-s{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.prog{height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
</style>
</head>

function makeSR(){
  // Build a fresh SR instance and start it
  // Called both initially and on each restart
  if(!SRC||!listening) return;
  if(activeRec){try{activeRec.abort();}catch(x){}activeRec=null;}
  try{
    const r=new SRC();
    r.lang="en-US";
    r.continuous=false;   // false = more reliable across all browsers
    r.interimResults=true;
    r.maxAlternatives=1;
    r.onresult=e=>{
      let final="",interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final+=e.results[i][0].transcript+" ";
        else interim+=e.results[i][0].transcript;
      }
      if(final.trim()) accTxt+=(accTxt?" ":"")+final.trim();
      const el=document.getElementById("vi");
      if(el){
        const show=(accTxt+(interim?" "+interim:"")).trim();
        el.textContent=show?'"'+show+'"':"（聞こえています...）";
      }
    };
    r.onerror=e=>{
      console.log("SR onerror:",e.error);
      // aborted = we called abort() ourselves, ignore
      if(e.error==="aborted") return;
      // no-speech = silence, restart
      if(e.error==="no-speech"){
        activeRec=null;
        if(listening) setTimeout(makeSR,100);
        return;
      }
      // Other errors: stop
      activeRec=null;listening=false;updateMicUI();
    };
    r.onend=()=>{
      console.log("SR onend, listening="+listening);
      activeRec=null;
      // If still in listening state, restart immediately
      if(listening) setTimeout(makeSR,80);
    };
    r.start();
    activeRec=r;
    console.log("SR started");
  }catch(e){
    console.error("makeSR error:",e.name,e.message);
    activeRec=null;listening=false;updateMicUI();
  }
}

function handleResult(knew){stopRepeat();const c=S.queue[S.qIdx];if(!c)return;const ex=S.deck[c.j]||{step:0,times:[]};const ns=knew?Math.min(ex.step+1,INTV.length):0;S.deck[c.j]={...ex,step:ns,nextReview:Date.now()+(INTV[ns]||0)*60000,graduated:ns>=INTV.length};S.todayCount++;if(!S.sessionSceneScores[c.sc])S.sessionSceneScores[c.sc]=[];S.sessionSceneScores[c.sc].push(S.flipTime||5);const scT={};Object.entries(S.deck).forEach(([k,v])=>{const q=QB.find(x=>x.j===k);if(!q||!v.times||!v.times.length)return;if(!scT[q.sc])scT[q.sc]=[];scT[q.sc].push(...v.times);});let sl=null,sa=0;Object.entries(scT).forEach(([sc,arr])=>{const avg=arr.reduce((a,b)=>a+b,0)/arr.length;if(avg>sa){sa=avg;sl=sc;}});S.weakScene=sl;save();const nx=S.qIdx+1;if(nx>=S.queue.length){S.mode="done";clearInterval(S.timerInterval);render();}else{S.qIdx=nx;S.flipped=false;S.voiceText="";S.voiceScore=null;S.voiceFeedback=null;render();startTimer();}}

  // filter

    fi.appendChild(lr);fc.appendChild(fi);
  }

  app.appendChild(b(`学習スタート (${filt.length}問) →`,{width:"100%",background:"linear-gradient(135deg,#1d4ed8,#3b82f6)",color:"#fff",padding:"16px",borderRadius:"14px",fontSize:"15px",fontWeight:"700",boxShadow:"0 4px 22px rgba(59,130,246,.35)",marginBottom:"8px"},startStudy));
  if(tL()>0){const ss=d({display:"flex",gap:"7px"});[{l:"学習中",c:tL()-tG(),col:"#3b82f6"},{l:"復習待ち",c:due.length,col:"#a78bfa"},{l:"定着済み",c:tG(),col:"#10b981"}].forEach(({l,c,col})=>{const dd=d({flex:"1",background:"rgba(15,23,42,.8)",border:"1px solid rgba(255,255,255,.05)",borderRadius:"10px",padding:"8px",textAlign:"center"});dd.innerHTML=`<div style="color:#334155;font-size:10px;margin-bottom:3px">${l}</div><div style="color:${col};font-size:18px;font-family:'DM Mono',monospace">${c}</div>`;ss.appendChild(dd);});app.appendChild(ss);}
}

function rStats(app){
  if(S.sessionTimes.length>0){const sc=d({background:"var(--card)",border:"1px solid var(--border)",borderRadius:"14px",padding:"16px",marginBottom:"12px"});sc.innerHTML=`<div style="font-size:13px;font-weight:700;margin-bottom:12px">⏱ 今セッションの反応時間</div>`;const ch=d({display:"flex",alignItems:"flex-end",gap:"3px",height:"50px"});const mx=Math.max(...S.sessionTimes,1);S.sessionTimes.forEach(t=>{const r=tR(t);const bar=d({flex:"1",minWidth:"4px",borderRadius:"2px",background:r?r.c:"#3b82f6",opacity:"0.85"});bar.style.height=`${Math.max(6,Math.round((t/mx)*50))}px`;ch.appendChild(bar);});sc.appendChild(ch);const avg=(S.sessionTimes.reduce((a,b)=>a+b,0)/S.sessionTimes.length).toFixed(1);sc.appendChild(d({color:"#475569",fontSize:"11px",marginTop:"8px"},`平均：${avg}s　最速：${Math.min(...S.sessionTimes)}s　最遅：${Math.max(...S.sessionTimes)}s`));app.appendChild(sc);}
  const scD={};Object.entries(S.deck).forEach(([k,v])=>{const c=QB.find(q=>q.j===k);if(!c)return;if(!scD[c.sc])scD[c.sc]={n:0,g:0,t:[]};scD[c.sc].n++;if(v.graduated)scD[c.sc].g++;if(v.times&&v.times.length)scD[c.sc].t.push(...v.times);});
  if(Object.keys(scD).length>0){const sc=d({background:"var(--card)",border:"1px solid var(--border)",borderRadius:"14px",padding:"16px"});sc.innerHTML=`<div style="font-size:13px;font-weight:700;margin-bottom:12px">📋 シーン別 習熟度</div>`;Object.entries(scD).forEach(([scene,dd])=>{const iw=scene===S.weakScene;const avg=dd.t.length?(dd.t.reduce((a,b)=>a+b,0)/dd.t.length).toFixed(1):null;const row=d({display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px",padding:"8px 10px",background:iw?"rgba(251,191,36,.06)":"rgba(255,255,255,.02)",borderRadius:"10px",border:`1px solid ${iw?"rgba(251,191,36,.2)":"rgba(255,255,255,.05)"}`});const cfg=SC[scene]||{em:"📌"};row.innerHTML=`<span style="font-size:16px">${cfg.em}</span><span style="font-size:13px;font-weight:700;color:${iw?"#fbbf24":"#94a3b8"};min-width:66px">${scene}${iw?" ⚠️":""}</span>`;const pb2=d({flex:"1",background:"rgba(255,255,255,.06)",borderRadius:"4px",height:"6px"});const pct=dd.n?Math.round(dd.g/dd.n*100):0;pb2.innerHTML=`<div style="width:${pct}%;background:#10b981;height:100%;border-radius:4px"></div>`;row.appendChild(pb2);row.appendChild(d({color:"#334155",fontSize:"11px",fontFamily:"'DM Mono',monospace",minWidth:"30px",textAlign:"right"},`${pct}%`));if(avg)row.appendChild(d({color:"#475569",fontSize:"11px",fontFamily:"'DM Mono',monospace",minWidth:"34px"},`⏱${avg}s`));sc.appendChild(row);});app.appendChild(sc);}
  else app.appendChild(d({color:"#475569",fontSize:"13px",textAlign:"center",padding:"32px"},"学習を始めると統計が表示されます"));
}

async function rStudy(app){
  const card=S.queue[S.qIdx];if(!card)return;
  const cfg=SC[card.sc]||{em:"📌",col:"#3b82f6",svg:""};
  const step=S.deck[card.j]?.step??null;
  const rating=tR(S.flipped?S.flipTime:S.elapsed);
  const dispT=S.flipped?S.flipTime:S.elapsed;
  const vsC=S.voiceScore===null?null:S.voiceScore>=80?"#10b981":S.voiceScore>=50?"#fbbf24":"#f87171";
  const isRev=S.mode==="review";

  // progress
  // ── MODE BANNER ─────────────────────────────────────────────────────────
  const mb2=d({width:"100%",borderRadius:"12px",padding:"10px 16px",marginBottom:"10px",
    display:"flex",alignItems:"center",justifyContent:"space-between",

    ?`<div style="color:#f87171;font-size:13px;font-weight:700">🎤 音声入力モード</div><div style="color:rgba(248,113,113,.6);font-size:11px">マイクボタンで録音 → 採点</div>`
    :`<div style="color:#60a5fa;font-size:13px;font-weight:700">🔇 サイレントモード</div><div style="color:rgba(96,165,250,.6);font-size:11px">カードをタップして答えを確認</div>`;
  mL.appendChild(mDot);mL.appendChild(mTxt);mb2.appendChild(mL);
  const mSwBtn=document.createElement("button");
  Object.assign(mSwBtn.style,{padding:"5px 12px",borderRadius:"20px",fontSize:"11px",fontWeight:"700",cursor:"pointer",
    background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.12)",color:"#94a3b8",fontFamily:"inherit"});
  mSwBtn.textContent="切替";mSwBtn.addEventListener("click",toggleVoiceMode);
  mb2.appendChild(mSwBtn);
  app.appendChild(mb2);

  const pr=d({display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"});
  if(isRev)pr.innerHTML+=`<span class="tag sr">🔁 復習</span>`;
  const pb=d({flex:"1",background:"rgba(255,255,255,.06)",borderRadius:"4px",height:"4px",overflow:"hidden"});
  pb.innerHTML=`<div style="width:${(S.qIdx/S.queue.length)*100}%;background:${isRev?"#7c3aed":"#3b82f6"};height:100%;border-radius:4px;transition:width .3s"></div>`;
  pr.appendChild(pb);pr.appendChild(d({color:"#334155",fontSize:"11px",fontFamily:"'DM Mono',monospace"},`${S.qIdx+1}/${S.queue.length}`));
  app.appendChild(pr);

  // timer
  const tr=d({display:"flex",justifyContent:"center",alignItems:"center",gap:"10px",marginBottom:"10px"});
  const tb=d({background:S.flipped&&rating?rating.bg:"rgba(255,255,255,.04)",border:`1px solid ${S.flipped&&rating?rating.b:"rgba(255,255,255,.08)"}`,borderRadius:"12px",padding:"6px 16px",display:"flex",alignItems:"center",gap:"8px",transition:"all .3s"});
  tb.innerHTML=`<span id="tv" style="color:${S.flipped&&rating?rating.c:"#475569"};font-size:20px;font-family:'DM Mono',monospace;font-weight:500;min-width:40px;text-align:right">${dispT!==null?dispT+"s":"—"}</span>`;
  if(S.flipped&&rating)tb.innerHTML+=`<span style="font-size:13px;color:${rating.c};font-weight:700">${rating.em} ${rating.l}</span>`;
  tr.appendChild(tb);
  tr.appendChild(d({display:"flex",gap:"4px",fontSize:"10px",color:"#1e293b"},"<span>⚡≤3s</span><span>🙂≤7s</span><span>🐢＞7s</span>"));
  app.appendChild(tr);

  // flip card
  const fw=d({marginBottom:"10px"});fw.className="fw";
  const fi=d({position:"relative",width:"100%",minHeight:"280px",transition:"transform .45s cubic-bezier(.4,0,.2,1)",transformStyle:"preserve-3d"});
  if(S.flipped)fi.style.transform="rotateY(180deg)";

  // --- FRONT ---
  const ff=d({backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",width:"100%",borderRadius:"20px",
    background:`linear-gradient(160deg,${cfg.svgBg||"#0d1b3e"},${isRev?"#2d1060":"#0d2a5e"})`,
    border:`1px solid ${isRev?"rgba(167,139,250,.2)":"rgba(59,130,246,.18)"}`,
    minHeight:"280px",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",
    padding:"22px 18px",textAlign:"center"});

  // image: try fetch, fallback to SVG
  const imgUrl=await fetchImg(card.sc).catch(()=>null);
  if(imgUrl){
    const img=document.createElement("img");
    img.src=imgUrl;img.className="card-img";
    img.onerror=()=>{img.style.display="none";};
    ff.appendChild(img);
  }else if(cfg.svg){
    const sv=d({width:"100%",maxWidth:"130px",opacity:"0.18",marginBottom:"8px"});sv.innerHTML=cfg.svg;ff.appendChild(sv);
  }

  const tags=d({display:"flex",gap:"5px",marginBottom:"12px",flexWrap:"wrap",justifyContent:"center"});
  tags.innerHTML=`<span class="tag l${card.lv}">${card.lv}</span><span class="tag sc">${cfg.em} ${card.sc}</span>${step!==null?`<span class="tag sr">${IL[step]||"定着"}</span>`:""}`;
  ff.appendChild(tags);
  ff.appendChild(d({color:"#f1f5f9",fontSize:"var(--card-font, 21px)",fontWeight:"700",lineHeight:"1.6",marginBottom:"14px"},card.j));
  if(!S.voiceMode)ff.appendChild(d({color:isRev?"#4c1d95":"#1e40af",fontSize:"13px"},"タップして答えを確認 →"));
  fi.appendChild(ff);

  // --- BACK ---
  const fb=d({backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",position:"absolute",top:"0",left:"0",width:"100%",borderRadius:"20px",transform:"rotateY(180deg)",
    background:"linear-gradient(160deg,#071a0d,#0a2a14)",border:"1px solid rgba(16,185,129,.2)",
    minHeight:"280px",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",

  fb.appendChild(d({color:"#6ee7b7",fontSize:"10px",letterSpacing:"3px",marginBottom:"10px"},"MODEL ANSWER"));
  fb.appendChild(d({color:"#f0fdf4",fontSize:"20px",fontWeight:"700",lineHeight:"1.6",fontFamily:"'DM Mono',monospace",marginBottom:"6px"},card.e));
  fb.appendChild(d({color:"rgba(148,163,184,.85)",fontSize:"var(--jp-font, 15px)",marginBottom:"10px"},card.j));
  if(card.ctx)fb.appendChild(d({color:"#166534",fontSize:"11px",marginBottom:"10px",lineHeight:"1.55",maxWidth:"310px"},`💡 ${card.ctx}`));

  if(S.voiceMode&&S.voiceText){

        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px">
          <div style="width:20px;height:20px;border:2px solid ${vsC};border-top-color:transparent;border-radius:50%;animation:spin .75s linear infinite"></div>

        </div>
      `;
    }
    fb.appendChild(vd);
  }
  fi.appendChild(fb);fw.appendChild(fi);

  // touch/click — card ONLY flips (voice recording is via dedicated mic button only)
  fw.addEventListener("touchend",e=>{
    e.preventDefault();e.stopPropagation();
    _tf=true;setTimeout(()=>{_tf=false;},600);
    flipCard();
  },{passive:false});
  fw.addEventListener("click",e=>{if(_tf)return;flipCard();});
  app.appendChild(fw);



  // voice mic button — only shown in voice mode on front side
  if(S.voiceMode&&!S.flipped){
    if(SRC){
      const micWrap=d({display:"flex",flexDirection:"column",alignItems:"center",gap:"10px",marginBottom:"8px"});
      // Big mic button
      const micBtn=document.createElement("button");
      micBtn.id="mic-btn";
      Object.assign(micBtn.style,{width:"80px",height:"80px",borderRadius:"50%",cursor:"pointer",
        background:listening?"linear-gradient(135deg,#dc2626,#ef4444)":"linear-gradient(135deg,#1d4ed8,#3b82f6)",
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:"32px",
        boxShadow:listening?"0 0 0 8px rgba(239,68,68,.2),0 4px 20px rgba(239,68,68,.4)":"0 4px 20px rgba(59,130,246,.4)",
        border:"none",flexShrink:"0",fontFamily:"inherit"});

        e.preventDefault();e.stopPropagation();
        _mTf=true;setTimeout(()=>{_mTf=false;},500);
        listening?stopListening():startListening();
      },{passive:false});
      micBtn.addEventListener("click",e=>{
        e.stopPropagation();
        if(_mTf)return;
        listening?stopListening():startListening();
      });
      micWrap.appendChild(micBtn);
      // Status + interim text — persistent elements updated by updateMicUI
      const micStatus=d({textAlign:"center"});
      micStatus.setAttribute("id","mic-status");
      micStatus.innerHTML=listening
        ?'<span style="color:#f87171;font-weight:700">🔴 録音中</span><br><span style="color:rgba(248,113,113,.6);font-size:12px">もう一度タップで停止＆判定</span>'

  app.appendChild(b("ホームへ",{background:"none",color:"#334155",fontSize:"12px",textDecoration:"underline",padding:"0",display:"block",margin:"10px auto 0"},goHome));
}

function rDone(app){
  const due=getDue();
  const w=d({background:"var(--card)",border:"1px solid var(--border)",borderRadius:"20px",padding:"32px 20px",textAlign:"center"});
  w.innerHTML=`<div style="font-size:44px;margin-bottom:12px">🎉</div><h2 style="font-size:20px;font-weight:700;margin-bottom:6px">セッション完了！</h2><p style="color:#475569;font-size:14px;margin-bottom:16px">${S.queue.length}問を学習しました</p>`;
  if(S.sessionTimes.length>0){const avg=(S.sessionTimes.reduce((a,b)=>a+b,0)/S.sessionTimes.length).toFixed(1);const r=tR(parseFloat(avg));const ts=d({background:r?r.bg:"rgba(255,255,255,.04)",border:`1px solid ${r?r.b:"rgba(255,255,255,.08)"}`,borderRadius:"12px",padding:"10px 14px",marginBottom:"14px",display:"inline-block"});ts.innerHTML=`<span style="color:${r?r.c:"#94a3b8"};font-size:20px;font-family:'DM Mono',monospace">${avg}s</span> <span style="color:${r?r.c:"#94a3b8"};font-size:13px">${r?r.em+" "+r.l:""} 平均反応時間</span>`;w.appendChild(ts);}
  const ss=d({display:"flex",gap:"7px",marginBottom:"16px"});[{l:"学習中",c:tL()-tG(),col:"#3b82f6"},{l:"復習待ち",c:due.length,col:"#a78bfa"},{l:"定着済み",c:tG(),col:"#10b981"}].forEach(({l,c,col})=>{const dd=d({flex:"1",background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.06)",borderRadius:"12px",padding:"10px 6px"});dd.innerHTML=`<div style="color:#334155;font-size:10px;margin-bottom:3px">${l}</div><div style="color:${col};font-size:18px;font-family:'DM Mono',monospace">${c}</div>`;ss.appendChild(dd);});
  w.appendChild(ss);

  if(due.length>0)btns.appendChild(b(`復習 (${due.length})`,{flex:"1",background:"linear-gradient(135deg,#6d28d9,#7c3aed)",color:"#fff",padding:"14px",borderRadius:"12px",fontSize:"14px",fontWeight:"700"},startReview));

  w.appendChild(btns);app.appendChild(w);
}
